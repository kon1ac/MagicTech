# Фрагмент postgresql.conf: непрерывное архивирование WAL → RPO ≤ 15 минут.
# Подключение: include_if_exists = 'magictech-wal.conf' в postgresql.conf, затем перезапуск PostgreSQL.
wal_level = replica
archive_mode = on
archive_timeout = 900                     # принудительное переключение сегмента WAL каждые 15 минут
archive_command = 'test ! -f /var/backups/magictech/wal/%f && cp %p /var/backups/magictech/wal/%f'
# Windows: archive_command = 'copy "%p" "D:\\Backups\\MagicTech\\wal\\%f"'
summarize_wal = on                        # PostgreSQL 17+: нужен для pg_basebackup --incremental
max_wal_senders = 5
# Для замеров производительности запросов:
shared_preload_libraries = 'pg_stat_statements'
# Point-in-time recovery: restore_command = 'cp /var/backups/magictech/wal/%f %p', recovery_target_time = '...'
