              schema:
                $ref: '#/components/schemas/Error'
          description: Объект не найден
  /api/v1/mobile/orders/:
    get:
      operationId: v1_mobile_orders_list
      summary: История заказов
      tags:
      - Мобильное приложение
      security:
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
          description: ''
    post:
      operationId: v1_mobile_orders_create
      summary: Оформить заказ из корзины (атомарно)
      tags:
      - Мобильное приложение
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Checkout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Checkout'
          multipart/form-data:
