          description: Ошибка валидации
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Нет или недействителен токен
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Недостаточно прав / нет scope
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Объект не найден
  /api/v1/mobile/orders/{number}/:
    get:
      operationId: v1_mobile_orders_retrieve
      summary: Заказ покупателя (только свой)
      parameters:
      - in: path
        name: number
        schema:
          type: string
        required: true
      tags:
      - Мобильное приложение
      security:
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Объект не найден
  /api/v1/payments/yookassa/webhook/:
    post:
      operationId: v1_payments_yookassa_webhook_create
      description: Тело — уведомление ЮKassa; заголовок X-Signature = HMAC-SHA256(тело,
        секрет). Обработка идемпотентна; заказ + платёж + резерв меняются атомарно.
      summary: Callback ЮKassa (имитация)
      tags:
      - Платёжный шлюз
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              Payment.succeeded:
                value:
                  type: notification
                  event: payment.succeeded
                  object:
                    id: yk-…
                    status: succeeded
                    amount:
                      value: '4990.00'
                      currency: RUB
                summary: payment.succeeded
      security:
      - {}
      responses:
        '200':
          description: '{"status": "ok"}'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Ошибка валидации
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Нет или недействителен токен
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Недостаточно прав / нет scope
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Объект не найден
components:
  schemas:
    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: {}
        promo_code:
          type: string
          nullable: true
        promo_error:
          type: string
          nullable: true
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        reserved_until:
          type: string
          format: date-time
          nullable: true
      required:
      - discount
      - items
      - promo_code
      - promo_error
      - reserved_until
      - subtotal
      - total
    CartItemIn:
      type: object
      properties:
        sku:
          type: string
          maxLength: 100
        quantity:
          type: integer
          maximum: 999
          minimum: 0
      required:
      - quantity
      - sku
    Category:
      type: object
      properties:
        id_category:
          type: integer
          readOnly: true
        category_name:
          type: string
          maxLength: 255
        category_slug:
          nullable: true
          oneOf:
          - type: string
            maxLength: 255
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        category_level:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        id_parent:
          type: integer
          nullable: true
      required:
      - category_level
      - category_name
      - id_category
    Checkout:
      type: object
      properties:
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        delivery_address:
          type: string
          maxLength: 500
        contact_phone:
          type: string
          maxLength: 30
        comment:
          type: string
          maxLength: 1000
        offer_accepted:
          type: boolean
        promo_code:
          type: string
          maxLength: 50
      required:
      - contact_phone
      - delivery_address
      - offer_accepted
      - payment_method
    Error:
      type: object
      properties:
        error:
          type: object
          additionalProperties: {}
      required:
      - error
    MarketplaceOrder:
      type: object
      properties:
        external_order_id:
          type: string
          maxLength: 100
        marketplace:
          type: string
          maxLength: 30
        customer_email:
          type: string
          format: email
        delivery_address:
          type: string
          maxLength: 500
        contact_phone:
          type: string
          maxLength: 30
        items:
          type: array
          items:
            $ref: '#/components/schemas/MarketplaceOrderItem'
      required:
      - contact_phone
      - customer_email
      - delivery_address
      - external_order_id
      - items
      - marketplace
    MarketplaceOrderItem:
      type: object
      properties:
        sku:
          type: string
          maxLength: 100
        quantity:
          type: integer
          maximum: 999
          minimum: 1
      required:
      - quantity
      - sku
    Order:
      type: object
      properties:
        order_number:
          type: string
          maxLength: 50
        order_status:
          type: string
          maxLength: 20
        order_payment_method:
          type: string
          nullable: true
          maxLength: 30
        order_payment_status:
          type: string
          nullable: true
          maxLength: 20
        order_channel:
          type: string
          maxLength: 20
        external_order_id:
          type: string
          nullable: true
          maxLength: 100
        customer:
          type: string
          format: email
          readOnly: true
        total_items:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        discount_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        delivery_address:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        paid_at:
          type: string
          format: date-time
          nullable: true
        shipped_at:
          type: string
          format: date-time
          nullable: true
        tracking_number:
          type: string
          nullable: true
          maxLength: 100
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
      required:
      - created_at
      - customer
      - items
      - order_number
    OrderItem:
      type: object
      properties:
        sku:
          type: string
        name:
          type: string
        order_item_quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        order_item_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        order_item_discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        order_item_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - name
      - order_item_price
      - order_item_quantity
      - order_item_total
      - sku
    PaymentMethodEnum:
      enum:
      - card_online
      - cash_on_delivery
      type: string
      description: |-
        * `card_online` - card_online
        * `cash_on_delivery` - cash_on_delivery
    Price:
      type: object
      properties:
        sku:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        currency:
          type: string
        valid_from:
          type: string
          format: date-time
      required:
      - currency
      - price
      - sku
      - valid_from
    Product:
      type: object
      properties:
        product_sku:
          type: string
          maxLength: 100
        product_ean:
          type: string
          nullable: true
          maxLength: 50
        product_name:
          type: string
          maxLength: 255
        brand:
          type: string
          readOnly: true
        category:
          type: string
          readOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        available:
          type: integer
          readOnly: true
        rating_avg:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
        rating_count:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        product_characteristics:
          nullable: true
      required:
      - available
      - brand
      - category
      - price
      - product_name
      - product_sku
    ProductDetail:
      type: object
      properties:
        product_sku:
          type: string
          maxLength: 100
        product_ean:
          type: string
          nullable: true
          maxLength: 50
        product_name:
          type: string
          maxLength: 255
        brand:
          type: string
          readOnly: true
        category:
          type: string
          readOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        available:
          type: integer
          readOnly: true
        rating_avg:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
        rating_count:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        product_characteristics:
          nullable: true
        product_description:
          type: string
          nullable: true
        images:
          type: array
          items:
            type: string
          readOnly: true
        seo_title:
          type: string
          nullable: true
          maxLength: 255
        seo_description:
          type: string
          nullable: true
          maxLength: 500
      required:
      - available
      - brand
      - category
      - images
      - price
      - product_name
      - product_sku
    Review:
      type: object
      properties:
        id_review:
          type: integer
          readOnly: true
        review_type:
          type: string
          maxLength: 20
        review_rating:
          type: integer
          maximum: 5
          minimum: 1
          nullable: true
        review_text:
          type: string
          nullable: true
        seller_answer:
          type: string
          nullable: true
        review_status:
          type: string
          maxLength: 20
        created_at:
          type: string
          format: date-time
          readOnly: true
        author:
          type: string
          readOnly: true
      required:
      - author
      - created_at
      - id_review
    ReviewIn:
      type: object
      properties:
        rating:
          type: integer
          maximum: 5
          minimum: 1
        text:
          type: string
          maxLength: 5000
        is_question:
          type: boolean
          default: false
      required:
      - text
    Shipment:
      type: object
      properties:
        tracking_number:
          type: string
          maxLength: 100
    StatusChange:
      type: object
      properties:
        status:
          type: string
          maxLength: 20
        reason:
          type: string
          maxLength: 500
      required:
      - status
    Stock:
      type: object
      properties:
        sku:
          type: string
        quantity:
          type: integer
        reserved:
          type: integer
        available:
          type: integer
      required:
      - available
      - quantity
      - reserved
      - sku
    StockOperation:
      type: object
      properties:
        quantity:
          type: integer
        reason:
          type: string
          maxLength: 500
        document_number:
          type: string
          maxLength: 50
      required:
      - quantity
      - reason
    TokenRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    TokenResponse:
      type: object
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - token
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Формат: `Token <ключ>`. Ключ выпускается в панели (Сервисные учётки)
        или через POST /api/v1/mobile/auth/token/ для покупателя.'
