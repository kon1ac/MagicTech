openapi: 3.0.3
info:
  title: MagicTech API
  version: 1.0.0
  description: 'REST API интернет-магазина MagicTech: маркетплейсы, мобильное приложение,
    платёжный шлюз ЮKassa (callback), внутренняя автоматизация заказов и склада. Авторизация:
    заголовок `Authorization: Token <ключ>`.'
paths:
  /api/v1/internal/orders/:
    get:
      operationId: v1_internal_orders_list
      summary: Заказы
      parameters:
      - in: query
        name: status
        schema:
          type: string
      tags:
      - Внутреннее API
      security:
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Ошибка валидации
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Нет или недействителен токен
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Недостаточно прав / нет scope
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Объект не найден
  /api/v1/internal/orders/{number}/status/:
    post:
      operationId: v1_internal_orders_status_create
      summary: Смена статуса заказа по регламенту
      parameters:
      - in: path
        name: number
        schema:
          type: string
        required: true
      tags:
      - Внутреннее API
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StatusChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StatusChange'
        required: true
      security:
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Ошибка валидации
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Нет или недействителен токен
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Недостаточно прав / нет scope
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Объект не найден
  /api/v1/internal/stock/{sku}/adjust/:
    post:
      operationId: v1_internal_stock_adjust_create
      summary: Критическая корректировка остатка (с причиной)
      parameters:
      - in: path
        name: sku
        schema:
          type: string
        required: true
      tags:
      - Внутреннее API
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockOperation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StockOperation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StockOperation'
        required: true
      security:
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stock'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Ошибка валидации
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Нет или недействителен токен
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Недостаточно прав / нет scope
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Объект не найден
  /api/v1/internal/stock/{sku}/receipt/:
    post:
      operationId: v1_internal_stock_receipt_create
      summary: Приход товара
      parameters:
      - in: path
        name: sku
        schema:
          type: string
        required: true
      tags:
      - Внутреннее API
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockOperation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StockOperation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StockOperation'
        required: true
      security:
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stock'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Ошибка валидации
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Нет или недействителен токен
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Недостаточно прав / нет scope
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Объект не найден
  /api/v1/marketplace/orders/:
    get:
      operationId: v1_marketplace_orders_list
      summary: Заказы с маркетплейсов
      parameters:
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ASSEMBLY
          - CANCELLED
          - COMPLETED
          - CONFIRMED
          - NEW
          - PACKED
          - PAID
          - RETURNED
      tags:
      - Маркетплейсы
      security:
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Ошибка валидации
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Нет или недействителен токен
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Недостаточно прав / нет scope
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Объект не найден
    post:
      operationId: v1_marketplace_orders_create
      description: 'Атомарно: покупатель + заказ + резерв + платёж (оплачен на площадке).
        Повтор с тем же external_order_id → 409.'
      summary: Загрузка заказа с маркетплейса
      tags:
      - Маркетплейсы
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketplaceOrder'
            examples:
              ЗаказOzon:
                value:
                  external_order_id: OZ-100500
                  marketplace: ozon
                  customer_email: buyer@ozon.example
                  delivery_address: Москва, ПВЗ Ozon
                  contact_phone: '+79990000000'
                  items:
                  - sku: KB-LOG-001
                    quantity: 1
                summary: Заказ Ozon
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MarketplaceOrder'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarketplaceOrder'
        required: true
      security:
      - TokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                ЗаказOzon:
                  value:
                    external_order_id: OZ-100500
                    marketplace: ozon
                    customer_email: buyer@ozon.example
                    delivery_address: Москва, ПВЗ Ozon
                    contact_phone: '+79990000000'
                    items:
                    - sku: KB-LOG-001
                      quantity: 1
                  summary: Заказ Ozon
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Ошибка валидации
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Ошибка валидации
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Нет или недействителен токен
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Недостаточно прав / нет scope
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Объект не найден
  /api/v1/marketplace/orders/{number}/ship/:
    post:
      operationId: v1_marketplace_orders_ship_create
      summary: Подтверждение отгрузки
      parameters:
      - in: path
        name: number
        schema:
          type: string
        required: true
      tags:
      - Маркетплейсы
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Shipment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Shipment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Shipment'
      security:
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Ошибка валидации
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Нет или недействителен токен
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Недостаточно прав / нет scope
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Объект не найден
  /api/v1/marketplace/prices/:
    get:
      operationId: v1_marketplace_prices_list
      summary: Текущие цены
      tags:
      - Маркетплейсы
      security:
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Price'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Ошибка валидации
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Нет или недействителен токен
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Недостаточно прав / нет scope
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Объект не найден
  /api/v1/marketplace/products/:
    get:
      operationId: v1_marketplace_products_list
      summary: Выгрузка товаров (цены и остатки)
      parameters:
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: updated_since
        schema:
          type: string
        description: 'ISO-дата: только изменённые после'
      tags:
      - Маркетплейсы
      security:
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Ошибка валидации
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Нет или недействителен токен
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Недостаточно прав / нет scope
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Объект не найден
  /api/v1/marketplace/stock/:
    get:
      operationId: v1_marketplace_stock_list
      summary: Остатки (в реальном времени, без кеша)
      tags:
      - Маркетплейсы
      security:
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Stock'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Ошибка валидации
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Нет или недействителен токен
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Недостаточно прав / нет scope
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Объект не найден
  /api/v1/mobile/auth/token/:
    post:
      operationId: v1_mobile_auth_token_create
      summary: Получить токен покупателя (30 дней)
      tags:
      - Мобильное приложение
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Ошибка валидации
  /api/v1/mobile/cart/:
    get:
      operationId: v1_mobile_cart_retrieve
      summary: Текущая корзина с расчётом
      tags:
      - Мобильное приложение
      security:
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Ошибка валидации
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Нет или недействителен токен
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Недостаточно прав / нет scope
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Объект не найден
    delete:
      operationId: v1_mobile_cart_destroy
      summary: Очистить корзину (резервы снимаются)
      tags:
      - Мобильное приложение
      security:
      - TokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/mobile/cart/items/:
    post:
      operationId: v1_mobile_cart_items_create
      description: Серверная проверка остатка и резерв на 20 минут.
      summary: Установить количество товара (0 — удалить)
      tags:
      - Мобильное приложение
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemIn'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CartItemIn'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CartItemIn'
        required: true
      security:
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Ошибка валидации
        '401':
          content:
            application/json:
