  /api/v1/mobile/catalog/categories/:
    get:
      operationId: v1_mobile_catalog_categories_list
      summary: Категории
      tags:
      - Мобильное приложение
      security:
      - TokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/mobile/catalog/products/:
    get:
      operationId: v1_mobile_catalog_products_list
      summary: Каталог с фильтрами (серверными)
      parameters:
      - in: query
        name: brand
        schema:
          type: array
          items:
            type: integer
      - in: query
        name: category
        schema:
          type: string
        description: slug
      - in: query
        name: in_stock
        schema:
          type: integer
          enum:
          - 0
          - 1
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: price_max
        schema:
          type: number
          format: double
      - in: query
        name: price_min
        schema:
          type: number
          format: double
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - new
          - popular
          - price_asc
          - price_desc
          - rating
      tags:
      - Мобильное приложение
      security:
      - TokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/mobile/catalog/products/{sku}/:
    get:
      operationId: v1_mobile_catalog_products_retrieve
      summary: Карточка товара
      parameters:
      - in: path
        name: sku
        schema:
          type: string
        required: true
      tags:
      - Мобильное приложение
      security:
      - TokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Объект не найден
  /api/v1/mobile/catalog/products/{sku}/reviews/:
    get:
      operationId: v1_mobile_catalog_products_reviews_list
      summary: Опубликованные отзывы и вопросы
      parameters:
      - in: path
        name: sku
        schema:
          type: string
        required: true
      tags:
      - Мобильное приложение
      security:
      - TokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
          description: ''
    post:
      operationId: v1_mobile_catalog_products_reviews_create
      summary: Оставить отзыв (только купившим) или вопрос
      parameters:
      - in: path
        name: sku
        schema:
          type: string
        required: true
      tags:
      - Мобильное приложение
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewIn'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewIn'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewIn'
        required: true
      security:
      - TokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Ошибка валидации
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
